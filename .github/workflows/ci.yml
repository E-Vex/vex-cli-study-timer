name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: make CC="${{ matrix.cc }}" CFLAGS="-Wall -Wextra -Werror -std=c11 -I. -O2"

      - name: Run tests
        run: make test CC="${{ matrix.cc }}" CFLAGS="-Wall -Wextra -Werror -std=c11 -I. -O2"

      - name: CLI smoke test
        run: |
          ./vex-timer --version
          ./vex-timer --help >/dev/null

          if ./vex-timer -s 0 -t 25 -b 5 >/dev/null 2>&1; then
            echo "expected invalid arguments to fail" >&2
            exit 1
          fi

          if ./vex-timer -s 1 -t 25 -b 5 -a bogus >/dev/null 2>&1; then
            echo "expected an unknown alarm to fail" >&2
            exit 1
          fi

          if ./vex-timer -s 4 -t 25 -b 5 -r 4 >/dev/null 2>&1; then
            echo "expected --long-break-every without --long-break to fail" >&2
            exit 1
          fi

          if ./vex-timer --sessions=4 --focus=0 --break=5 >/dev/null 2>&1; then
            echo "expected an invalid inline option value to fail" >&2
            exit 1
          fi

          if ./vex-timer --help=1 >/dev/null 2>&1; then
            echo "expected --help=1 to fail" >&2
            exit 1
          fi

      - name: Install smoke test
        run: |
          make install DESTDIR="$PWD/stage"

          test -x stage/usr/local/bin/vex-timer
          test -f stage/usr/local/share/man/man1/vex-timer.1

          make uninstall DESTDIR="$PWD/stage"

          test ! -e stage/usr/local/bin/vex-timer
          test ! -e stage/usr/local/share/man/man1/vex-timer.1
          # Uninstall also removes the now-empty directories it created.
          test ! -e stage

  sanitizer-build:
    name: ubuntu-latest / gcc / sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test with ASan and UBSan
        run: |
          SAN_FLAGS="-Wall -Wextra -Werror -std=c11 -I. -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          make CC=gcc CFLAGS="$SAN_FLAGS" LDFLAGS="-lm -fsanitize=address,undefined"
          make test CC=gcc CFLAGS="$SAN_FLAGS" LDFLAGS="-lm -fsanitize=address,undefined"

      - name: CLI smoke test
        run: |
          ./vex-timer --version

          if ./vex-timer -s 0 -t 25 -b 5 >/dev/null 2>&1; then
            echo "expected invalid arguments to fail" >&2
            exit 1
          fi
